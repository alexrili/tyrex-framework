# .tyrex/tyrex.yml - Tyrex Framework Configuration
# Docs: https://github.com/tyrex-framework/tyrex

project:
  name: "{{PROJECT_NAME}}"
  created: "{{DATE}}"

# Operation mode
mode:
  commits: "{{COMMIT_MODE}}"         # "auto" | "approve"
  branches: "{{BRANCH_MODE}}"        # "auto" | "approve"
  changelog: "always"                # LOCKED - always enabled
  documentation: "{{DOC_MODE}}"      # "always" | "suggest" | "minimal"

# Documentation defaults for new demands (/tyrex-new)
docs:
  # Built-in doc types (shipped with Tyrex)
  spec: true                        # LOCKED - always true (technical specification per task)
  srs: true                         # Software Requirements Specification per demand
  prd: true                         # Product Requirements Document per demand
  adr: true                         # Architecture Decision Records
  rfc: false                        # Technical proposals
  wiki: true                        # Project wiki pages
  diagrams: true                    # D2 diagrams (d2lang.com) — architecture, sequence, data-flow, ER
  changelog: true                   # LOCKED - always true

  # Custom doc types — add your own documentation layers
  # Each entry defines a doc type that appears in /tyrex-new and /tyrex-settings
  # Fields:
  #   name:      Display name (used in menus and file naming)
  #   template:  Path to the markdown template (relative to project root)
  #   scope:     "demand" (one per feature) or "task" (one per task)
  #   mandatory: true = always generated, false = optional per demand
  #
  # Example:
  # custom:
  #   - name: "runbook"
  #     template: ".tyrex/templates/runbook.md"
  #     scope: "demand"
  #     mandatory: false
  #   - name: "test-plan"
  #     template: ".tyrex/templates/test-plan.md"
  #     scope: "demand"
  #     mandatory: true
  #   - name: "release-notes"
  #     template: ".tyrex/templates/release-notes.md"
  #     scope: "demand"
  #     mandatory: false
  custom: []

# Quality guardrails
quality:
  lint: true
  security_scan: true
  review_checklist: true
  # Adaptive quality strategy per area type
  # Values: "required" (TDD mandatory) | "recommended" (tests suggested) | "optional" (ask user)
  strategy:
    default: "required"            # Fallback for areas not listed below
    api: "required"                # API endpoints, controllers
    workers: "required"            # Background jobs, queue processors
    data: "required"               # Models, migrations, data layer
    security: "required"           # Auth, encryption, access control
    frontend: "recommended"        # UI components, views
    mobile: "recommended"          # Mobile-specific code
    infra: "optional"             # Docker, CI/CD, config files
    docs: "optional"              # Documentation generation

# Parallelization
parallel:
  enabled: true
  max_agents: {{MAX_AGENTS}}
  auto_suggest: true                 # Suggest parallelization when possible

# Git
git:
  branch_prefix: "{{BRANCH_PREFIX}}"
  commit_style: "{{COMMIT_STYLE}}"   # "conventional" | "descriptive"
  auto_push: false                   # Never auto-push by default

# External tracker integration (Jira, Linear, GitHub Issues)
# Requires an MCP server configured in your AI agent for the chosen provider.
# Auth is managed by the MCP server — Tyrex stores only identity config.
integrations:
  tracker:
    provider: {{TRACKER_PROVIDER}}   # "jira" | "linear" | "github-issues" | null
    project: "{{TRACKER_PROJECT}}"   # Default project key (e.g., "HOT", "PROJ")
    user: "{{TRACKER_USER}}"         # User email/handle for assignments and comments
