id: BL-014
title: "Git como espinha dorsal — commits semânticos + tags automáticas"
status: done
priority: high
epic: EP-004
effort: M
phase: 3
description: |
  Consolidação de BL-014 + BL-015. Git como audit trail completo do projeto.

  A) Commits semânticos automáticos — discuss, backlog e plan geram commits
     de contexto (.tyrex/ only, nunca código). Mensagens com prefixo semântico:
     - backlog: add BL-017 — nova ideia
     - discuss: enrich BL-005 — pipeline completo
     - plan: roadmap v3 — reorder phases
     - backlog: ready BL-001 — checkpoint system confirmed
     Configurável via tyrex.yml: auto-commit ou batch no final do comando.

  B) Tags automáticas em milestones:
     - tyrex-feature-NNN-done → quando feature aprovada no review
     - tyrex-phase-N-done → quando todas as features de uma phase completam
     - tyrex-vX.Y.Z → quando version bump acontece
     git tag --list 'tyrex-*' mostra progresso completo do projeto.

  C) Recovery enriquecido via git log — DEFERRED para Phase 5.
     Branch history como evolução de ideias vem grátis com os commits semânticos.
acceptance_criteria:
  - Comandos plan-mode geram commits automáticos (.tyrex/ only)
  - Prefixos semânticos: backlog:, discuss:, plan:
  - Configurável via tyrex.yml (auto-commit ou batch)
  - Tags criadas em: feature approved, phase completed, version bump
  - Tags seguem padrão: tyrex-feature-NNN-done, tyrex-phase-N-done, tyrex-vX.Y.Z
  - git tag --list 'tyrex-*' mostra progresso completo
