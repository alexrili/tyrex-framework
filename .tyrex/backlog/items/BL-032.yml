id: BL-032
title: "Semantic commit validation hook"
status: ready
priority: high
epic: EP-007
effort: S
phase: 1
description: |
  Hook pre-commit (commit-msg) que valida formato conventional commits.
  Regex: ^(feat|fix|chore|docs|refactor|test|style|perf|ci|build|revert|backlog|discuss|plan|evolve|context|security|debug|verify|ship|milestone|workstream)(\(.+\))?: .+
  Inclui prefixos Tyrex (backlog, discuss, plan, etc) além dos conventional padrão.
acceptance_criteria:
  - Valida formato conventional commit no commit message
  - Suporta prefixos padrão (feat, fix, chore, etc)
  - Suporta prefixos Tyrex (backlog, discuss, plan, evolve, etc)
  - Mensagem clara com formato esperado quando inválido
  - Aceita breaking change indicator (!)
  - Flag --no-commit-lint para bypass
origin: "discuss session 2026-03-27 — production-ready"
created: "2026-03-27"
