description: |
  Hook pre-commit que valida: se source files changed, CHANGELOG.md deve ter
  entrada correspondente. Bloqueia commits sem CHANGELOG quando source files mudam.
  Permite commits sem CHANGELOG para .tyrex/ only changes (state updates).
acceptance_criteria:
  - Bloqueia commit se source files staged sem CHANGELOG entry
  - Permite commits de .tyrex/ files sem CHANGELOG
  - Permite commits de docs/ files sem CHANGELOG
  - Mensagem clara indicando que CHANGELOG é obrigatório
  - Flag --no-changelog para bypass explícito
