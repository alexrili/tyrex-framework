description: |
  /tyrex-new e /tyrex-quick oferecem items ready do backlog como primeira opção.
  /tyrex-quick com --backlog executa items ready sequencialmente.
  Status do item atualiza automaticamente ao longo do pipeline:
  draft > ready > in-progress > done | discarded
acceptance_criteria:
  - /tyrex-new lista items ready do backlog como opção
  - /tyrex-quick --backlog executa items sequencialmente
  - Status atualiza automaticamente durante execução
  - Item ganha feature_id quando vira feature
  - Items done não aparecem mais nas sugestões
